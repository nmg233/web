# ============================================================
# PBL 科创育人平台 - nginx 站点配置
# 用法：放到 /etc/nginx/conf.d/ 下（http 上下文），
#       替换 your.domain.com 与证书路径后 `nginx -t && systemctl reload nginx`。
# 对应环境：前端根目录 /var/www/pbl-platform，后端 127.0.0.1:3000（API_PREFIX=/api）。
# ============================================================

# 隐藏 nginx 版本号，降低信息泄漏
server_tokens off;

# ---- HTTP：默认跳转 HTTPS（启用证书后取消注释 return 301）----
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 启用 HTTPS 后打开：强制跳转
    # return 301 https://$host$request_uri;

    root /var/www/pbl-platform;
    index index.html;

    # 安全响应头（静态页当前由 nginx 直接服务，原本缺失）
    add_header X-Frame-Options "SAMEORIGIN" always;       # 防点击劫持
    add_header X-Content-Type-Options "nosniff" always;   # 防 MIME 嗅探
    add_header Referrer-Policy "same-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # 对齐后端 multer 上限（作品上传 100MB）
        client_max_body_size 110m;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name your.domain.com;

    ssl_certificate     /etc/nginx/cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS：仅在确认 HTTPS 正常后再启用，避免把域名锁死在 HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/pbl-platform;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 110m;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
